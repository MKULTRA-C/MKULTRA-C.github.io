<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ti ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100 vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear - gradient (135 deg, #ff758c, #ff7eb3);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .contenedor {
      text-align: center;
      color: white;
    }

    .corazon {
      font-size: 100 px;
      animation: latido 1 s infinite;
    }

    h1 {
      font-size: 40 px;
      margin: 10 px;
    }

    p {
      font-size: 20 px;
    }

    @ keyframes latido {
      0% {
        transform: scale (1);
      }

      50% {
        transform: scale(1.25);
      }

      100 % {
        transform: scale (1);
      }
    }

    .boton {
      margin-top: 20 px; 
      padding: 12 px 25 px;
      border: none;
      border-radius: 25 px;
      background: white;
      color: #ff4f81;
      font-size: 18 px;
      cursor: pointer;
    }

    .boton:hover {
      transform: scale (1.1);
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <div class="corazon">❤️</div>

    <h1>Para alguien especial</h1>

    <p id="mensaje">
      Eres una persona muy importante para mí 💕
    </p>

    <button class="boton" onclick="mostrarMensaje()">
      Haz clic aquí 💌
    </button>
  </div>

  <script>
    functionmostrarMensaje() {
      document.getElementById("mensaje").innerHTML =
        "Gracias por existir y hacer mis días más bonitos ❤️✨";
    }
  </script>

</body>
</html>
